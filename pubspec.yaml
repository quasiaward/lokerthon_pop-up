name: haenggung_dagwa
description: "행궁다과 다과 추천 - 아이패드 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/figma/
    - assets/figma/quiz/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 500
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 600
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          weight: 400
          style: italic
