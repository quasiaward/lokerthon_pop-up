name: haenggung_dagwa
description: "행궁다과 다과 추천 - 아이패드 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/figma/
    - assets/figma/quiz/
    - assets/figma/logo/
    - assets/figma/deco/
    - assets/figma/recommend/

  fonts:
    - family: Gowun Batang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
          weight: 400
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
